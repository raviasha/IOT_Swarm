name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python tests
      run: |
        cd sim
        python -m pytest tests/ -v --tb=short

    - name: Run linting
      run: |
        pip install flake8
        flake8 sim/ --max-line-length=120 --ignore=E501,W503

  go-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Gateway
      run: |
        cd gateway
        go mod download
        go build -v ./...

    - name: Run Go tests
      run: |
        cd gateway
        go test -v ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, go-build]

    steps:
    - uses: actions/checkout@v4

    - name: Build Gateway Docker image
      run: |
        cd gateway
        docker build -t p2p-gateway:test .

    - name: Build Simulator Docker image
      run: |
        docker build -f Dockerfile.sim -t p2p-simulator:test .
